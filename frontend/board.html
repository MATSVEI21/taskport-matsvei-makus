<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskBoard – tablica zadań w trzech kolumnach z filtrami po priorytecie, osobie i tytule.">
  <title>Tablica – TaskBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar tb-navbar" aria-label="Główna nawigacja">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="boards.html">TaskBoard</a>
      <div class="d-flex align-items-center gap-2">
        <span class="tb-user"><span class="tb-user-label">Zalogowano: </span><strong id="userName"></strong></span>
        <button type="button" class="btn btn-sm btn-outline-light" id="logoutBtn">Wyloguj</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-3 py-4">
    <nav aria-label="Ścieżka nawigacji">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="boards.html">Tablice</a></li>
        <li class="breadcrumb-item active" aria-current="page" id="crumbName">Tablica</li>
      </ol>
    </nav>

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-2 mb-3">
      <div>
        <h1 class="h2 fw-normal mb-1" id="boardTitle">Tablica</h1>
        <p class="text-muted-tb mb-0" id="boardDescription"></p>
      </div>
      <button type="button" class="btn btn-primary align-self-start" id="newTaskBtn">Dodaj zadanie</button>
    </div>

    <div id="alerts"></div>

    <form class="row g-3 align-items-end mb-3" id="filters" aria-label="Filtry zadań" novalidate>
      <div class="col-12 col-md-3">
        <label for="filterPriority" class="form-label small mb-1">Priorytet</label>
        <select class="form-select" id="filterPriority">
          <option value="">Wszystkie</option>
          <option value="high">Wysoki</option>
          <option value="medium">Średni</option>
          <option value="low">Niski</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label for="filterAssignee" class="form-label small mb-1">Osoba</label>
        <select class="form-select" id="filterAssignee">
          <option value="">Wszyscy</option>
        </select>
      </div>
      <div class="col-12 col-md-4">
        <label for="filterQuery" class="form-label small mb-1">Szukaj w tytułach</label>
        <input type="search" class="form-control" id="filterQuery" placeholder="np. README" autocomplete="off">
      </div>
      <div class="col-12 col-md-2">
        <button type="button" class="btn btn-outline-secondary w-100" id="clearFilters">Wyczyść filtry</button>
      </div>
    </form>

    <div class="row g-3" aria-live="polite">
      <section class="col-12 col-lg-4" aria-labelledby="h-todo">
        <div class="tb-column tb-col-todo h-100">
          <h2 class="h5 d-flex justify-content-between align-items-center mb-2" id="h-todo">
            Do zrobienia <span class="badge badge-count" id="count-todo">0</span>
          </h2>
          <div class="d-grid gap-2" id="col-todo"></div>
        </div>
      </section>
      <section class="col-12 col-lg-4" aria-labelledby="h-in_progress">
        <div class="tb-column tb-col-in_progress h-100">
          <h2 class="h5 d-flex justify-content-between align-items-center mb-2" id="h-in_progress">
            W trakcie <span class="badge badge-count" id="count-in_progress">0</span>
          </h2>
          <div class="d-grid gap-2" id="col-in_progress"></div>
        </div>
      </section>
      <section class="col-12 col-lg-4" aria-labelledby="h-done">
        <div class="tb-column tb-col-done h-100">
          <h2 class="h5 d-flex justify-content-between align-items-center mb-2" id="h-done">
            Gotowe <span class="badge badge-count" id="count-done">0</span>
          </h2>
          <div class="d-grid gap-2" id="col-done"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Okno dodawania, edycji i szczegółów zadania -->
  <div class="modal fade" role="dialog" id="taskModal" tabindex="-1" aria-labelledby="taskModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="taskForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="taskModalTitle">Nowe zadanie</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
        </div>
        <div class="modal-body">
          <div id="taskError"></div>
          <div class="mb-3">
            <label for="taskTitle" class="form-label">Tytuł</label>
            <input type="text" class="form-control" id="taskTitle" required>
            <div class="invalid-feedback">Tytuł musi mieć od 3 do 100 znaków</div>
          </div>
          <div class="mb-3">
            <label for="taskDescription" class="form-label">Opis (opcjonalnie)</label>
            <textarea class="form-control" id="taskDescription" rows="3"></textarea>
            <div class="invalid-feedback">Opis może mieć najwyżej 2000 znaków</div>
          </div>
          <div class="row g-3">
            <div class="col-12 col-sm-6">
              <label for="taskStatus" class="form-label">Status</label>
              <select class="form-select" id="taskStatus">
                <option value="todo">Do zrobienia</option>
                <option value="in_progress">W trakcie</option>
                <option value="done">Gotowe</option>
              </select>
            </div>
            <div class="col-12 col-sm-6">
              <label for="taskPriority" class="form-label">Priorytet</label>
              <select class="form-select" id="taskPriority">
                <option value="high">Wysoki</option>
                <option value="medium" selected>Średni</option>
                <option value="low">Niski</option>
              </select>
            </div>
            <div class="col-12 col-sm-6">
              <label for="taskDeadline" class="form-label">Termin (opcjonalnie)</label>
              <input type="date" class="form-control" id="taskDeadline">
              <div class="invalid-feedback">Podaj poprawną datę</div>
            </div>
            <div class="col-12 col-sm-6">
              <label for="taskAssignee" class="form-label">Osoba (opcjonalnie)</label>
              <select class="form-select" id="taskAssignee">
                <option value="">Nieprzypisane</option>
              </select>
            </div>
          </div>
          <p class="small text-muted-tb mt-3 mb-0" id="taskCreated"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="submit" class="btn btn-primary">Zapisz zadanie</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Okno potwierdzenia usunięcia -->
  <div class="modal fade" role="dialog" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="confirmTitle">Potwierdzenie</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
        </div>
        <div class="modal-body" id="confirmText"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="button" class="btn btn-danger" id="confirmOk">Usuń</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
