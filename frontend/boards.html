<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskBoard – lista tablic zespołu: dodawanie, edycja i usuwanie tablic.">
  <title>Tablice – TaskBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar tb-navbar" aria-label="Główna nawigacja">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="boards.html">TaskBoard</a>
      <div class="d-flex align-items-center gap-2">
        <span class="tb-user"><span class="tb-user-label">Zalogowano: </span><strong id="userName"></strong></span>
        <button type="button" class="btn btn-sm btn-outline-light" id="logoutBtn">Wyloguj</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-3 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h2 fw-normal mb-0">Tablice</h1>
      <button type="button" class="btn btn-primary" id="newBoardBtn">Nowa tablica</button>
    </div>

    <div id="alerts"></div>
    <div class="row g-3" id="boardList" aria-live="polite"></div>
  </main>

  <!-- Okno dodawania i edycji tablicy -->
  <div class="modal fade" role="dialog" id="boardModal" tabindex="-1" aria-labelledby="boardModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="boardForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="boardModalTitle">Nowa tablica</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
        </div>
        <div class="modal-body">
          <div id="boardError"></div>
          <div class="mb-3">
            <label for="boardName" class="form-label">Nazwa</label>
            <input type="text" class="form-control" id="boardName" maxlength="120" required>
            <div class="invalid-feedback">Nazwa musi mieć od 1 do 80 znaków.</div>
          </div>
          <div class="mb-1">
            <label for="boardDescription" class="form-label">Opis (opcjonalnie)</label>
            <textarea class="form-control" id="boardDescription" rows="3"></textarea>
            <div class="invalid-feedback">Opis może mieć najwyżej 255 znaków.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="submit" class="btn btn-primary">Zapisz tablicę</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Okno potwierdzenia usunięcia -->
  <div class="modal fade" role="dialog" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="confirmTitle">Potwierdzenie</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
        </div>
        <div class="modal-body" id="confirmText"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="button" class="btn btn-danger" id="confirmOk">Usuń</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/boards.js"></script>
</body>
</html>
